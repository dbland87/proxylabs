<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proxylabs.gg</title>
  <meta name="description" content="Proxylabs.gg LLC — independent game studio.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #101014;
      --fg: #e8e6e1;
      --muted: #9a968e;
      --accent: #d8a24a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #faf8f4;
        --fg: #23211d;
        --muted: #6f6a61;
        --accent: #a06d1f;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main { text-align: center; max-width: 34rem; }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: normal;
      letter-spacing: 0.02em;
    }
    .rule {
      width: 4rem;
      height: 1px;
      background: var(--accent);
      margin: 1.5rem auto;
    }
    p { color: var(--muted); line-height: 1.6; }
    .game { color: var(--fg); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Proxylabs.gg</h1>
    <div class="rule"></div>
    <p>An independent game studio in Utah.</p>
    <p>Maker of <span class="game">Wakewalkers</span>.</p>
    <p><a href="mailto:support@proxylabs.gg">support@proxylabs.gg</a></p>
    <footer>&copy; 2026 Proxylabs.gg LLC</footer>
  </main>
</body>
</html>
